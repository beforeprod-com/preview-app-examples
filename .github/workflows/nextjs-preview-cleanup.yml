# Next.js Preview Cleanup Workflow
#
# Authentication (Settings → Secrets and variables → Actions):
#   BP_USER     - Beforeprod username
#   BP_PASSWORD - Beforeprod password
#
# Required permissions: pull-requests: read (to read PR description for deployment URL)

name: Next.js Preview Cleanup

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to cleanup (required for manual cleanup)'
        required: true
        type: number

  pull_request:
    types: [closed]
    paths:
      - 'examples/nextjs-minimal/**'
      - '.github/workflows/nextjs-preview-cleanup.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cleanup deployment
        uses: beforeprod-com/preview-deployment-action@83d462340daea49fd9e6b16d88dc89bb64b95bf9
        with:
          action: cleanup
        env:
          BP_USER: ${{ secrets.BP_USER }}
          BP_PASSWORD: ${{ secrets.BP_PASSWORD }}
