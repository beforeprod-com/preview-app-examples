# Next.js Preview Cleanup Workflow
#
# CLEANUP GATED: This workflow uses workflow_dispatch only.
# To enable automatic cleanup on PR close, uncomment the pull_request trigger below.
#
# Authentication (Settings → Secrets and variables → Actions):
#   SHPR_TOKEN - Beforeprod/Werft API token (writes .werft config before cleanup)
#
# Required permissions: pull-requests: read (to read PR description for deployment URL)

name: Next.js Preview Cleanup

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to cleanup (required for manual cleanup)'
        required: true
        type: number

  # UNCOMMENT BELOW TO ENABLE AUTOMATIC CLEANUP ON PR CLOSE:
  # pull_request:
  #   types: [closed]
  #   paths:
  #     - 'examples/nextjs-minimal/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Beforeprod auth
        run: jq -n --arg token "$SHPR_TOKEN" '{token:$token}' > ~/.werft
        env:
          SHPR_TOKEN: ${{ secrets.SHPR_TOKEN }}

      - name: Cleanup deployment
        uses: beforeprod-com/preview-deployment-action@83d462340daea49fd9e6b16d88dc89bb64b95bf9
        with:
          action: cleanup
